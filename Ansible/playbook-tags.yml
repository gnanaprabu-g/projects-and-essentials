- hosts: play
  remote_user: ec2-user
  become: yes
  tasks:
  - name: Install Apache
    yum:
      name: httpd
      state: present
  - name: Start Apache service
    service:
      name: httpd
      state: started
  - name: Copy files
    copy:
      src: /home/ec2-user/index.html
      dest: /var/www/html/index.html
      mode: 0644
    tags:
      - copy