- hosts: debug
  remote_user: ec2-user
  become: yes
  tasks:
  - name: Modify the designation line
    lineinfile:
      path: /home/ec2-user/sample.txt
      regexp: '^Designation:'
      line: 'Designation: SRE'
  - name: Get file content
    shell: cat /home/ec2-user/sample.txt
    register: file_content
  - name: View file content
    debug:
      var: file_content.stdout_lines
