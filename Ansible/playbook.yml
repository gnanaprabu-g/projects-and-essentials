- hosts: play
  remote_user: ec2-user
  become: yes
  tasks:
  - name: Install Apache
    yum:
      name: httpd
      state: present
  - name: Start service httpd, if not running
    service:
      name: httpd
      state: started
  - name: copy file to remote
    copy:
      src: /home/ec2-user/index.html
      dest: /var/www/html/index.html
      mode: 0644


      