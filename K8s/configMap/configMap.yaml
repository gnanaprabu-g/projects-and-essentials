apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
  namespace: default
data:
  APP_NAME: "My-APP-2"
  APP_ENV: "production-2"
  APP_PORT: "8080"
  DB_HOST: "mysql-service-2"
  LOG_LEVEL: "info"
---
apiVersion: v1
kind: Pod
metadata:
  name: sample-app
spec:
  containers:
    - name: my-container
      image: gnanaprabu/python-app:v1
      envFrom:
        - configMapRef:
            name: app-config